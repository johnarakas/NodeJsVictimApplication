name: Generate SBOM

on:
  push:
    branches: ["**"]       # every commit on every branch
  pull_request:
    branches: ["**"]

jobs:
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. Install dependencies (needed so the SBOM reflects real deps)
      - name: Install dependencies
        run: npm ci

      # 4. Generate the SBOM
      - name: Generate SBOM
        run: npm run sbom

      # 5. Upload the SBOM as a build artifact (downloadable from Actions UI)
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 90